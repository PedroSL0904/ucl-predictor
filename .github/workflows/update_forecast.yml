name: Update UCL Tournament Forecast

on:
  schedule:
    - cron: '0 6 * * 2,4'  # Tuesday and Thursday mornings (UCL matchdays)
  workflow_dispatch:        # Allows manual trigger in GitHub Actions UI

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest tests/ -q

      - name: Re-simulate Tournament and Re-generate README.md
        run: |
          python -m scripts.08_generate_tournament_readme

      - name: Commit and Push Updated Forecast
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/processed/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update UCL tournament predictions and Monte Carlo projections [skip ci]" && git push)
